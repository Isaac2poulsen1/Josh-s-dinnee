<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supper Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG NOTE FOR THE HOST — see the JS CONFIG object below.
     Edit the date, menu, payment details and deposit there.
     Bump CONFIG.editionNumber each month to start a fresh guest
     ledger automatically.
     ============================================================ */

  :root{
    --ink: #211c17;
    --ink-soft: #2c251e;
    --parchment: #f2e9d8;
    --parchment-dim: #e9dec6;
    --brass: #a97c3f;
    --brass-bright: #c99a5b;
    --wine: #7a2331;
    --text-on-ink: #d9cdb4;
    --text-on-ink-dim: #a89a80;
    --text-on-parchment: #2c2115;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(169,124,63,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(122,35,49,0.10), transparent 45%);
    color: var(--text-on-ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .eyebrow{
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brass-bright);
    text-align: center;
    margin: 0 0 18px;
    font-weight: 600;
  }

  .hero-date{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(38px, 9vw, 64px);
    line-height: 1.05;
    text-align: center;
    color: var(--parchment);
    margin: 0 0 10px;
  }

  .hero-sub{
    text-align: center;
    color: var(--text-on-ink-dim);
    font-size: 15px;
    margin: 0 0 40px;
  }

  .hero-sub span{ color: var(--text-on-ink); }

  .divider{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 40px 0;
    color: var(--brass);
    opacity: 0.8;
  }
  .divider::before, .divider::after{
    content: '';
    height: 1px;
    width: 100%;
    max-width: 120px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
  }
  .divider svg{ width: 16px; height: 16px; flex-shrink: 0; }

  .card{
    background: var(--parchment);
    color: var(--text-on-parchment);
    border-radius: 3px;
    padding: 36px 30px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04) inset;
    position: relative;
    margin-bottom: 28px;
  }
  .card::before{
    content:'';
    position:absolute; inset: 8px;
    border: 1px solid rgba(122,35,49,0.18);
    border-radius: 2px;
    pointer-events:none;
  }

  .card-label{
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--wine);
    font-weight: 700;
    margin: 0 0 14px;
  }

  .menu-title{
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--text-on-parchment);
  }

  .menu-desc{
    font-size: 15.5px;
    color: #4a3c28;
    margin: 0;
  }

  .meta-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid rgba(122,35,49,0.15);
    font-size: 13.5px;
  }
  .meta-item strong{
    display:block;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 3px;
    font-weight: 700;
  }

  .price-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
  }

  .price-block{ }
  .price-block .label{
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .price-block .amount{
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 600;
    color: var(--wine);
  }
  .price-block .amount.secondary{
    color: #4a3c28;
    font-size: 22px;
  }

  .pay-methods{
    margin-top: 22px;
    display: grid;
    gap: 10px;
  }

  .pay-method{
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(122,35,49,0.06);
    border: 1px solid rgba(122,35,49,0.15);
    border-radius: 6px;
    padding: 12px 14px;
    gap: 12px;
  }
  .pay-method .name{
    font-weight: 600;
    font-size: 13px;
    color: var(--wine);
    min-width: 64px;
  }
  .pay-method .handle{
    font-family: 'Inter', monospace;
    font-size: 14px;
    color: #3a2f1f;
    flex: 1;
  }
  .copy-btn{
    border: 1px solid var(--brass);
    background: transparent;
    color: var(--brass);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }
  .copy-btn:hover{ background: var(--brass); color: #fff; }
  .copy-btn:focus-visible, .reserve-btn:focus-visible, input:focus-visible{
    outline: 2px solid var(--wine);
    outline-offset: 2px;
  }

  .note{
    margin-top: 18px;
    font-size: 12.5px;
    color: #6b5a40;
    font-style: italic;
  }

  .ledger-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .ledger-count{
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--brass-bright);
    font-size: 14px;
  }

  .ledger-list{
    list-style: none;
    margin: 18px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .ledger-row{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 4px;
    border-bottom: 1px solid rgba(122,35,49,0.12);
    font-size: 14.5px;
  }
  .ledger-row:last-child{ border-bottom: none; }

  .seat-no{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--wine);
    min-width: 46px;
  }

  .seat-name{
    flex: 1;
    color: #2c2115;
    font-weight: 500;
  }

  .seat-time{
    font-size: 11.5px;
    color: #8a7a5e;
  }

  .remove-x{
    background: none;
    border: none;
    color: #b08a8a;
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 6px;
  }
  .remove-x:hover{ color: var(--wine); }

  .empty-ledger{
    color: #8a7a5e;
    font-size: 14px;
    font-style: italic;
    padding: 14px 4px;
  }

  .reserve-form{
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px dashed rgba(122,35,49,0.25);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field-label{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
  }

  input[type="text"]{
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(122,35,49,0.3);
    border-radius: 6px;
    background: #fbf6ea;
    color: #2c2115;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
  }

  .confirm-row{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13.5px;
    color: #4a3c28;
  }
  .confirm-row input[type="checkbox"]{
    margin-top: 3px;
    accent-color: var(--wine);
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .reserve-btn{
    background: var(--wine);
    color: #f2e9d8;
    border: none;
    padding: 14px 20px;
    border-radius: 6px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .reserve-btn:hover:not(:disabled){ background: #911d2d; }
  .reserve-btn:active:not(:disabled){ transform: scale(0.99); }
  .reserve-btn:disabled{
    background: #b09a94;
    cursor: not-allowed;
    opacity: 0.6;
  }

  .form-msg{
    font-size: 13px;
    min-height: 18px;
  }
  .form-msg.error{ color: var(--wine); }
  .form-msg.success{ color: #3f6b3f; }

  footer{
    text-align: center;
    margin-top: 44px;
    color: var(--text-on-ink-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ transition: none !important; }
  }

  @media (max-width: 480px){
    .card{ padding: 26px 20px; }
    .price-row{ flex-direction: column; align-items: flex-start; gap: 10px; }
  }
</style>
</head>
<body>
<div class="page">

  <p class="eyebrow" id="eyebrow"></p>
  <h1 class="hero-date" id="heroDate"></h1>
  <p class="hero-sub" id="heroSub"></p>

  <div class="divider">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2v20M8 2v6a2 2 0 0 0 4 0M16 2v20M8 14h8"/></svg>
  </div>

  <section class="card">
    <p class="card-label">On the table</p>
    <h2 class="menu-title" id="menuTitle"></h2>
    <p class="menu-desc" id="menuDesc"></p>
    <div class="meta-row" id="metaRow"></div>
  </section>

  <section class="card">
    <p class="card-label">Payment</p>
    <div class="price-row">
      <div class="price-block">
        <div class="label">Deposit to reserve</div>
        <div class="amount" id="depositAmount"></div>
      </div>
      <div class="price-block">
        <div class="label">Total per seat</div>
        <div class="amount secondary" id="totalAmount"></div>
      </div>
    </div>
    <div class="pay-methods" id="payMethods"></div>
    <p class="note" id="payNote"></p>
  </section>

  <section class="card">
    <p class="card-label">Guest ledger</p>
    <div class="ledger-head">
      <span></span>
      <span class="ledger-count" id="ledgerCount"></span>
    </div>
    <ul class="ledger-list" id="ledgerList"></ul>

    <div class="reserve-form">
      <div>
        <label class="field-label" for="nameInput">Your name</label>
        <input type="text" id="nameInput" placeholder="e.g. Sam Ortiz" maxlength="60" autocomplete="name">
      </div>
      <label class="confirm-row">
        <input type="checkbox" id="confirmCheck">
        <span id="confirmLabel"></span>
      </label>
      <button class="reserve-btn" id="reserveBtn">Reserve my seat</button>
      <p class="form-msg" id="formMsg"></p>
    </div>
  </section>

  <footer id="footerNote"></footer>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, set, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================================================================
   HOST CONFIG — edit this block for each dinner. Bump
   editionNumber every month to automatically start a fresh,
   empty guest ledger (it keys the Realtime Database path off this
   number). Fill in firebaseConfig with the values from your
   Firebase project (see the setup steps you were given).
   ================================================================ */
const CONFIG = {
  editionNumber: 1,
  dateDisplay: "Wednesday, July 15th",
  timeDisplay: "7:00 PM",
  location: "43 Edgeware Road, Enmore",

  menuTitle: "Josh's Dinner Bonanza",
  menuDescription: "An evening built around whatever's best at the market that week — expect something slow-roasted, a bright vegetable course, and a dessert worth being late to bed for. Menu confirmed a few days out; let the host know about dietaries.",

  depositAmount: "15 per seat",
  totalAmount: "$15 / seat",

  paymentMethods: [
    { label: "PayID", handle: "0490871390" },
  ],

  payNote: "Send the deposit with your name in the memo, then add yourself to the ledger below — it's the honor system, so please only reserve a seat you've actually paid for.",

  confirmLabelText: "I've sent the deposit above",

  footerNote: "Supper Club — a monthly dinner, cooked with care.",

  seatsCapNote: "", // optional, e.g. "Limited to 10 seats"

  // Paste the config object Firebase gives you when you register a
  // "Web app" in your project settings, plus your Realtime Database
  // URL (visible at the top of the Data tab, looks like
  // https://your-project-default-rtdb.firebaseio.com).
  firebaseConfig: {
    apiKey: "AIzaSyA5McKIqPRNoldE5-7aWJA8sPOfq2LraFU",
    authDomain: "joshs-dinner.firebaseapp.com",
    databaseURL: "https://joshs-dinner-default-rtdb.firebaseio.com",
    projectId: "joshs-dinner",
    storageBucket: "joshs-dinner.firebasestorage.app",
    messagingSenderId: "405631652194",
    appId: "1:405631652194:web:6d7347e695ac9a25455c3b"
  }
};
/* ================================================================ */

const app = initializeApp(CONFIG.firebaseConfig);
const db = getDatabase(app);
const dinnerRef = ref(db, `dinners/edition-${CONFIG.editionNumber}/attendees`);

function fillText(id, text){
  const el = document.getElementById(id);
  if(el) el.textContent = text;
}

function renderStatic(){
  fillText('eyebrow', `Supper Club — Edition No. ${String(CONFIG.editionNumber).padStart(2,'0')}`);
  fillText('heroDate', CONFIG.dateDisplay);
  document.getElementById('heroSub').innerHTML =
    `<span>${CONFIG.timeDisplay}</span> &middot; ${CONFIG.location}`;

  fillText('menuTitle', CONFIG.menuTitle);
  fillText('menuDesc', CONFIG.menuDescription);

  const metaRow = document.getElementById('metaRow');
  metaRow.innerHTML = `
    <div class="meta-item"><strong>Date</strong>${CONFIG.dateDisplay}</div>
    <div class="meta-item"><strong>Time</strong>${CONFIG.timeDisplay}</div>
    <div class="meta-item"><strong>Where</strong>${CONFIG.location}</div>
  `;

  fillText('depositAmount', CONFIG.depositAmount);
  fillText('totalAmount', CONFIG.totalAmount);
  fillText('payNote', CONFIG.payNote);
  fillText('confirmLabel', CONFIG.confirmLabelText);
  fillText('footerNote', CONFIG.footerNote + (CONFIG.seatsCapNote ? ' · ' + CONFIG.seatsCapNote : ''));

  const payMethods = document.getElementById('payMethods');
  payMethods.innerHTML = '';
  CONFIG.paymentMethods.forEach(m => {
    const row = document.createElement('div');
    row.className = 'pay-method';
    row.innerHTML = `
      <span class="name">${m.label}</span>
      <span class="handle">${m.handle}</span>
      <button class="copy-btn" type="button">Copy</button>
    `;
    row.querySelector('.copy-btn').addEventListener('click', (e) => {
      navigator.clipboard.writeText(m.handle).then(() => {
        const btn = e.target;
        const original = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = original; }, 1400);
      }).catch(() => {});
    });
    payMethods.appendChild(row);
  });
}

function formatTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }catch(e){ return ''; }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let currentList = [];

function renderLedger(list){
  const ul = document.getElementById('ledgerList');
  const count = document.getElementById('ledgerCount');
  count.textContent = list.length === 1 ? '1 seat reserved' : `${list.length} seats reserved`;

  if(list.length === 0){
    ul.innerHTML = `<li class="empty-ledger">No seats reserved yet — be the first.</li>`;
    return;
  }

  ul.innerHTML = '';
  list.forEach((entry, idx) => {
    const li = document.createElement('li');
    li.className = 'ledger-row';
    li.innerHTML = `
      <span class="seat-no">No. ${String(idx + 1).padStart(3,'0')}</span>
      <span class="seat-name">${escapeHtml(entry.name)}</span>
      <span class="seat-time">${formatTime(entry.addedAt)}</span>
      <button class="remove-x" title="Remove this name" aria-label="Remove ${escapeHtml(entry.name)}">&times;</button>
    `;
    li.querySelector('.remove-x').addEventListener('click', () => handleRemove(entry));
    ul.appendChild(li);
  });
}

// Live updates: if a friend on another device reserves a seat,
// everyone's page updates automatically, no refresh needed.
onValue(dinnerRef, (snapshot) => {
  const data = snapshot.val() || {};
  currentList = Object.entries(data)
    .map(([key, val]) => ({ id: key, ...val }))
    .sort((a, b) => new Date(a.addedAt) - new Date(b.addedAt));
  renderLedger(currentList);
}, (err) => {
  setMsg('Could not connect to the guest ledger. Check the Firebase setup.', 'error');
});

async function handleRemove(entry){
  const ok = confirm('Remove this name from the guest ledger?');
  if(!ok) return;
  try{
    await remove(ref(db, `dinners/edition-${CONFIG.editionNumber}/attendees/${entry.id}`));
  }catch(e){
    alert('Could not remove that name. Please try again.');
  }
}

function setMsg(text, type){
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'form-msg' + (type ? ' ' + type : '');
}

async function handleReserve(){
  const nameInput = document.getElementById('nameInput');
  const confirmCheck = document.getElementById('confirmCheck');
  const name = nameInput.value.trim();

  if(!name){
    setMsg('Enter your name to reserve a seat.', 'error');
    return;
  }
  if(!confirmCheck.checked){
    setMsg('Please confirm you\'ve sent the deposit first.', 'error');
    return;
  }
  if(currentList.some(e => e.name.toLowerCase() === name.toLowerCase())){
    setMsg('That name is already on the ledger.', 'error');
    return;
  }

  const btn = document.getElementById('reserveBtn');
  btn.disabled = true;
  setMsg('Saving…', '');

  const entry = { name, addedAt: new Date().toISOString() };

  try{
    const newEntryRef = push(dinnerRef);
    await set(newEntryRef, entry);
    nameInput.value = '';
    confirmCheck.checked = false;
    setMsg('You\'re on the ledger — see you at the table.', 'success');
  }catch(e){
    setMsg('Something went wrong saving your seat. Please try again.', 'error');
  }
  btn.disabled = false;
}

document.getElementById('reserveBtn').addEventListener('click', handleReserve);
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') handleReserve();
});

renderStatic();
</script>

</body>
</html>
